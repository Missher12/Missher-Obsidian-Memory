name: 自检

# 这个工作流只跑**仓库自带的、确定性的**检查：
# 类型检查、单元测试、CLI/MCP 端到端、构建产物边界、打包与校验和。
#
# 它**不**跑协调者的独立验收脚本（那些脚本在协调目录里，不属于本仓库），
# 也**不**做原生 Obsidian GUI 验收（需要真实桌面与系统许可，
# 见 docs/ARCHITECTURE.md 与 README 的「明确没有验证的部分」）。
#
# 产品约束：测试与构建并发最多 1。这里的 job 也串行执行。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      # 仓库声明了 packageManager + 提交了 pnpm-lock.yaml，
      # 因此这里用 frozen lockfile 安装：锁文件与 package.json 不一致时直接失败，
      # 而不是悄悄装出另一套依赖树。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: 安装依赖（严格按锁文件）
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 打包并核对校验和
        run: pnpm package

      # scripts/verify.mjs 是有序执行的：类型检查 → 插件产物边界
      # （不得出现 node: 引用）→ 三项类型检查 → 单元测试 → CLI 端到端 →
      # MCP 端到端 → 校验和一致。任何一步失败就停在那里。
      - name: 全量自检
        run: pnpm verify

      - name: 上传产物（ZIP / tgz / 校验和）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missher-obsidian-memory-0.1.0
          path: |
            dist/missher-obsidian-memory-0.1.0.zip
            dist/mom-memory-cli-0.1.0.tgz
            dist/SHA256SUMS.txt
          if-no-files-found: warn
